<ion-header>
  <app-navbar headerTitle="{{ 'oneclick.pages.sign_in.header' | translate }}" skipId="skip-sign-in"></app-navbar>
</ion-header>

<ion-content>

  <ion-grid>
    <form (ngSubmit)="signIn(signInForm.form.valid)" #signInForm="ngForm">

      <ion-row>
        <ion-col class="ion-text-center">
          <img aria-hidden="true" class="lynx-logo-md" src="assets/img/main-logo.png" alt="logo"/>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col>
          <ion-item lines="none">
            <ion-label>{{ 'oneclick.asterick-instructions' | translate }}</ion-label>
        </ion-item>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col>
          <ion-item lines="none">
            <ion-input type="email" required class="input-background"
                       labelPlacement="fixed" label="{{'email' | translate}} *"
                        name="email"
                        [(ngModel)]="user.email">
          </ion-input>
        </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col>
          <ion-item lines="none">
            <ion-input type="email" required class="input-background"
                       labelPlacement="fixed" label="{{'password' | translate}} *"
                        name="password"
                        [(ngModel)]="user.password">
          </ion-input>
          </ion-item>

        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col class="ion-text-center">
          <ion-button shape="round" expand="full" color="primary" type="submit">
            {{ "oneclick.pages.sign_in.sign_in_button" | translate }}
          </ion-button>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col class="ion-text-center">
          <a [routerLink]="signUpPath">
            {{ "oneclick.pages.menu.sign_up" | translate }}
          </a>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col class="ion-text-center">
          <a [routerLink]="resetPasswordPath">
            {{ "oneclick.pages.sign_in.reset_password_button" | translate }}
          </a>
        </ion-col>
      </ion-row>
      <!-- Disable confirmation
      <ion-row>
        <ion-col text-center>
          <button type="button" class="lynx-button-link link-black" (click)="resendConfirmation()">
            {{ "oneclick.pages.sign_in.resend_confirmation_button" | translate }}
          </button>
        </ion-col>
      </ion-row>
    -->

    </form>
  </ion-grid>

</ion-content>
<app-footer></app-footer>
